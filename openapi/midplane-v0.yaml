          headers:
            X-Request-ID:
              description: Echo of the request id, or a server-generated id.
              required: true
              schema:
                type: string
            RateLimit-Limit:
              description: Maximum authenticated requests in the current window.
              required: true
              schema:
                type: integer
            RateLimit-Remaining:
              description: Requests left in the current window after this response.
              required: true
              schema:
                type: integer
            RateLimit-Reset:
              description: Seconds until the oldest request in the window expires.
              required: true
              schema:
