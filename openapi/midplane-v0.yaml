  /v1/runs/{run_id}/events:
    get:
      tags:
      - runs
      summary: Run Events
      operationId: run_events_v1_runs__run_id__events_get
      security:
      - HTTPBearer: []
      parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
          title: Run Id
      - name: Last-Event-ID
        in: header
        required: false
        schema:
          title: Last-Event-Id
          type:
          - string
          - 'null'
      - name: X-Request-ID
        in: header
        required: false
        description: Optional caller-supplied id. The response echoes it. The server
          generates one when the header is omitted.
        schema: *id001
      responses:
        '200':
          description: 'Server-Sent Events for one run. Each frame is three lines:
            `id`, `event`, and `data`, then a blank line.


            `id` is a decimal integer, monotonic per run, starting at 1. It is stored
            with the run, not per connection.

            Send it back as the `Last-Event-ID` request header to resume. The server
            replays frames whose id is greater than that value.

            If the header is missing, not an integer, or not an id this run has stored,
            the server replays the whole log.


            `event` is one of `run.started`, `node.started`, `node.completed`, `run.completed`,
            `run.failed`.

            `data` is one JSON object. Its shape is the schema named for that event.


            The graph reports a node when the node returns. The gateway then appends
            `node.started` and `node.completed` for that node, in that order, with
            the same `at` timestamp.'
