openapi: 3.1.0
info:
  title: Mid-plane Gateway API
  summary: v0 HTTP contract for iOS and other clients.
  description: 'Mid-plane Gateway API v0. Paths live under /v1. This document''s version
    is 0.1.0.


    Authentication v0: `Authorization: Bearer <api key>` on every path except `GET
    /healthz`.

    Keys are scoped to a client id such as `ios-dev`. A key reads only the runs and
    episodes created with that key.


    Errors use one shape: `{"error": {"code": string, "message": string, "request_id":
    string}}`.

    Every response carries `X-Request-ID`. Clients may send that header; otherwise
    the server generates one.


    Pagination: list bodies are `{"data": [...], "next_cursor": string | null, "limit":
    integer}`.

    `limit` defaults to 50 and must be from 1 to 100. `cursor` is opaque. Send `next_cursor`
    back as `cursor` for the next page. An unknown cursor returns `invalid_cursor`.


    Rate limiting v0 is per API key inside a single process. Responses include `X-RateLimit-Limit`
    and `X-RateLimit-Remaining`. Over the limit, the status is 429 and the code is
    `rate_limited`.


    Auth v1 is not built. The planned path is Sign in with Apple, then a short-lived
    JWT from this gateway. Bearer API keys stay available for service clients.


    This contract has no trading endpoints.'
  version: 0.1.0
servers:
- url: http://localhost:8000
  description: Local
paths:
  /healthz:
    get:
      tags:
      - health
      summary: Healthz
      operationId: healthz_healthz_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /v1/runs:
    post:
      tags:
      - runs
      summary: Create Run
      operationId: create_run_v1_runs_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRunRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateRunResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /v1/runs/{run_id}:
    get:
      tags:
      - runs
      summary: Get Run
      operationId: get_run_v1_runs__run_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
          title: Run Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunStatusResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/runs/{run_id}/events:
    get:
      tags:
      - runs
      summary: Run Events
      operationId: run_events_v1_runs__run_id__events_get
      security:
      - HTTPBearer: []
      parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
          title: Run Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/episodes/{episode_id}:
    get:
      tags:
      - episodes
      summary: Get Episode
      operationId: get_episode_v1_episodes__episode_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: episode_id
        in: path
        required: true
        schema:
          type: string
          title: Episode Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EpisodeResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/agents:
    get:
      tags:
      - agents
      summary: List Agents
      operationId: list_agents_v1_agents_get
      security:
      - HTTPBearer: []
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 50
          title: Limit
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Cursor
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentPage'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    Agent:
      properties:
        name:
          type: string
          title: Name
        title:
          type: string
          title: Title
        status:
          type: string
          title: Status
      type: object
      required:
      - name
      - title
      - status
      title: Agent
    AgentPage:
      properties:
        data:
          items:
            $ref: '#/components/schemas/Agent'
          type: array
          title: Data
        next_cursor:
          anyOf:
          - type: string
          - type: 'null'
          title: Next Cursor
        limit:
          type: integer
          title: Limit
      type: object
      required:
      - data
      - next_cursor
      - limit
      title: AgentPage
    CreateRunRequest:
      properties:
        task_type:
          type: string
          const: code_review
          title: Task Type
        input:
          $ref: '#/components/schemas/RunInput'
        client_ref:
          anyOf:
          - type: string
            maxLength: 200
          - type: 'null'
          title: Client Ref
      additionalProperties: false
      type: object
      required:
      - task_type
      - input
      title: CreateRunRequest
    CreateRunResponse:
      properties:
        run_id:
          type: string
          title: Run Id
        status:
          type: string
          enum:
          - queued
          - running
          - succeeded
          - failed
          title: Status
      type: object
      required:
      - run_id
      - status
      title: CreateRunResponse
    EpisodeResponse:
      properties:
        episode_id:
          type: string
          title: Episode Id
        source:
          type: string
          title: Source
        inputs:
          additionalProperties: true
          type: object
          title: Inputs
        plan:
          additionalProperties: true
          type: object
          title: Plan
        tool_calls:
          items: {}
          type: array
          title: Tool Calls
        model_choices:
          items: {}
          type: array
          title: Model Choices
        outputs:
          additionalProperties: true
          type: object
          title: Outputs
        cost:
          additionalProperties: true
          type: object
          title: Cost
        latency_ms:
          type: integer
          title: Latency Ms
        outcome:
          type: string
          title: Outcome
        quality_score:
          type: number
          title: Quality Score
        trace:
          items: {}
          type: array
          title: Trace
      type: object
      required:
      - episode_id
      - source
      - inputs
      - plan
      - tool_calls
      - model_choices
      - outputs
      - cost
      - latency_ms
      - outcome
      - quality_score
      - trace
      title: EpisodeResponse
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    HealthResponse:
      properties:
        status:
          type: string
          const: ok
          title: Status
      type: object
      required:
      - status
      title: HealthResponse
    RunInput:
      properties:
        diff:
          type: string
          minLength: 1
          title: Diff
          description: Unified diff to review.
        repo:
          type: string
          title: Repo
          default: local
        instructions:
          type: string
          title: Instructions
          default: Review this diff.
      additionalProperties: false
      type: object
      required:
      - diff
      title: RunInput
    RunStatusResponse:
      properties:
        run_id:
          type: string
          title: Run Id
        status:
          type: string
          enum:
          - queued
          - running
          - succeeded
          - failed
          title: Status
        result:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Result
        episode_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Episode Id
        task_type:
          type: string
          title: Task Type
        client_ref:
          anyOf:
          - type: string
          - type: 'null'
          title: Client Ref
        error:
          anyOf:
          - type: string
          - type: 'null'
          title: Error
      type: object
      required:
      - run_id
      - status
      - result
      - episode_id
      - task_type
      - client_ref
      - error
      title: RunStatusResponse
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
  securitySchemes:
    HTTPBearer:
      type: http
      description: Bearer API key scoped to a client such as ios-dev.
      scheme: bearer
