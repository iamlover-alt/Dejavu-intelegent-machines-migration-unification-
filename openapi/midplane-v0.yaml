openapi: 3.1.0
info:
  title: Mid-plane Gateway API
  summary: v0 HTTP contract for iOS and other clients.
  description: 'Mid-plane Gateway API v0. Paths live under /v1. This document''s version
    is 0.1.0.


    Authentication v0: `Authorization: Bearer <api key>` on every path except `GET
    /healthz`.

    Keys are scoped to a client id such as `ios-dev`. A key reads only the runs and
    episodes created with that key.


    Errors use one shape: `{"error": {"code": string, "message": string, "request_id":
    string}}`.

    Every response carries `X-Request-ID`. Clients may send that header; otherwise
    the server generates one.


    Pagination: list bodies are `{"data": [...], "next_cursor": string | null, "limit":
    integer}`.

    `limit` defaults to 50 and must be from 1 to 100. `cursor` is opaque. Send `next_cursor`
    back as `cursor` for the next page. An unknown cursor returns `invalid_cursor`.


    Rate limiting v0 is per API key inside a single process. Authenticated responses
    include `RateLimit-Limit`, `RateLimit-Remaining`, and `RateLimit-Reset` (seconds
    until the window moves). Over the limit, the status is 429, the code is `rate_limited`,
    and the response also includes `Retry-After`.


    Auth v1 is not built. The planned path is Sign in with Apple, then a short-lived
    JWT from this gateway. Bearer API keys stay available for service clients.


    `POST /v1/runs` accepts `task_type` `code_review` or `schema_agent`, or an `agent`
    name (`schema-agent` or `schema_agent`). A code review requires `input.diff`.
    A schema agent run requires `input.goal` (or a non-default `input.instructions`).


    `POST /v1/retrieve` searches episode memory, schema and connector documents, or
    decision traces.

    Episode and trace hits are limited to the API key''s client. A chain spec hops
    across those stores inside this process.

    The endpoint does not call a model.


    This contract has no trading endpoints.'
