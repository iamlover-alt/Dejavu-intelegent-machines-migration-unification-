components:
  schemas:
    Agent:
      properties:
        name:
          type: string
          title: Name
        title:
          type: string
          title: Title
        status:
          type: string
          title: Status
      type: object
      required:
      - name
      - title
      - status
      title: Agent
    AgentPage:
      properties:
        data:
          items:
            $ref: '#/components/schemas/Agent'
          type: array
          title: Data
        next_cursor:
          title: Next Cursor
          type:
          - string
          - 'null'
        limit:
          type: integer
          title: Limit
      type: object
      required:
      - data
      - limit
      title: AgentPage
      description: next_cursor is JSON null when there is no next page. The key is
        sent. It may also be omitted.
    ChainStepRequest:
      properties:
        store:
          type: string
          enum:
          - episodes
          - schema
          - traces
          title: Store
        query:
          title: Query
          type:
          - string
          - 'null'
        filters:
          title: Filters
          additionalProperties: true
          type:
          - object
          - 'null'
        top_k:
          title: Top K
          maximum: 50.0
          minimum: 1.0
          type:
          - integer
          - 'null'
        use_previous:
          type: boolean
          title: Use Previous
          default: false
      additionalProperties: false
      type: object
      required:
      - store
      title: ChainStepRequest
      description: One hop. ``query`` defaults to the request query. ``use_previous``
        appends the prior hit's name.
    CreateRunRequest:
      properties:
        task_type:
          title: Task Type
          description: 'Worker to run: code_review or schema_agent. Optional when
            agent is set. JSON null is allowed.'
          type:
          - string
          - 'null'
        agent:
          title: Agent
          description: Agent name. schema-agent selects the schema agent. Optional
            when task_type is set.
          maxLength: 100
          type:
          - string
          - 'null'
        input:
          $ref: '#/components/schemas/RunInput'
        client_ref:
          title: Client Ref
          maxLength: 200
          type:
          - string
          - 'null'
      additionalProperties: false
      type: object
      required:
      - input
      title: CreateRunRequest
    CreateRunResponse:
      properties:
        run_id:
          type: string
          title: Run Id
        status:
          type: string
          enum:
          - queued
          - running
          - succeeded
          - failed
          title: Status
      type: object
      required:
      - run_id
      - status
      title: CreateRunResponse
    EpisodePage:
      properties:
        data:
          items:
            $ref: '#/components/schemas/EpisodeSummary'
          type: array
          title: Data
        next_cursor:
          title: Next Cursor
          type:
          - string
          - 'null'
        limit:
          type: integer
          title: Limit
      type: object
      required:
      - data
      - limit
      title: EpisodePage
      description: next_cursor is JSON null when there is no next page. The key is
        sent. It may also be omitted.
    EpisodeResponse:
      properties:
        episode_id:
          type: string
          title: Episode Id
        source:
          type: string
          title: Source
        inputs:
          additionalProperties: true
          type: object
          title: Inputs
        plan:
          additionalProperties: true
          type: object
          title: Plan
        tool_calls:
          items: {}
          type: array
          title: Tool Calls
        model_choices:
          items: {}
          type: array
          title: Model Choices
        outputs:
          additionalProperties: true
          type: object
          title: Outputs
        cost:
          additionalProperties: true
          type: object
          title: Cost
        latency_ms:
          type: integer
          title: Latency Ms
        outcome:
          type: string
          title: Outcome
        quality_score:
          type: number
          title: Quality Score
        score_version:
          type: string
          title: Score Version
        created_at:
          type: string
          title: Created At
        trace:
          items: {}
          type: array
          title: Trace
      type: object
      required:
      - episode_id
      - source
      - inputs
      - plan
      - tool_calls
      - model_choices
      - outputs
      - cost
      - latency_ms
      - outcome
      - quality_score
      - score_version
      - created_at
      - trace
      title: EpisodeResponse
    EpisodeSummary:
      properties:
        episode_id:
          type: string
          title: Episode Id
        source:
          type: string
          title: Source
        outcome:
          type: string
          title: Outcome
        quality_score:
          type: number
          title: Quality Score
        score_version:
          type: string
          title: Score Version
        created_at:
          type: string
          title: Created At
        latency_ms:
          type: integer
          title: Latency Ms
      type: object
      required:
      - episode_id
      - source
      - outcome
      - quality_score
      - score_version
      - created_at
      - latency_ms
      title: EpisodeSummary
    HealthResponse:
      properties:
        status:
          type: string
          const: ok
          title: Status
      type: object
      required:
      - status
      title: HealthResponse
    HopModel:
      properties:
        hop:
          type: integer
          title: Hop
        store:
          type: string
          title: Store
        query:
          type: string
          title: Query
        filters:
          additionalProperties: true
          type: object
          title: Filters
        doc_ids:
          items:
            type: string
          type: array
          title: Doc Ids
        dropped_duplicates:
          items:
            type: string
          type: array
          title: Dropped Duplicates
        model_rewritten:
          type: boolean
          title: Model Rewritten
      type: object
      required:
      - hop
      - store
      - query
      - filters
      - doc_ids
      - dropped_duplicates
      - model_rewritten
      title: HopModel
    RetrievalHitModel:
      properties:
        doc_id:
          type: string
          title: Doc Id
        store:
          type: string
          title: Store
        text:
          type: string
          title: Text
        score:
          type: number
          title: Score
        fusion_score:
          title: Fusion Score
          type:
          - number
          - 'null'
        metadata:
          additionalProperties: true
          type: object
          title: Metadata
        breakdown:
          $ref: '#/components/schemas/ScoreBreakdownModel'
      type: object
      required:
      - doc_id
      - store
      - text
      - score
      - metadata
      - breakdown
      title: RetrievalHitModel
      description: fusion_score is JSON null unless this hit came from a multi-hop
        chain.
    RetrieveRequest:
      properties:
        store:
          type: string
          enum:
          - episodes
          - schema
          - traces
          - chain
          title: Store
        query:
          type: string
          maxLength: 4000
          minLength: 1
          title: Query
        filters:
          title: Filters
          additionalProperties: true
          type:
          - object
          - 'null'
        top_k:
          type: integer
          maximum: 50.0
          minimum: 1.0
          title: Top K
          default: 5
        chain:
          title: Chain
          items:
            $ref: '#/components/schemas/ChainStepRequest'
          type:
          - array
          - 'null'
      additionalProperties: false
      type: object
      required:
      - store
      - query
      title: RetrieveRequest
    RetrieveResponse:
      properties:
        data:
          items:
            $ref: '#/components/schemas/RetrievalHitModel'
          type: array
          title: Data
        hops:
          items:
            $ref: '#/components/schemas/HopModel'
          type: array
          title: Hops
        fused:
          type: boolean
          title: Fused
        truncated:
          type: boolean
          title: Truncated
      type: object
      required:
      - data
      - hops
      - fused
      - truncated
      title: RetrieveResponse
    RunInput:
      properties:
        diff:
          title: Diff
          description: Unified diff to review. Required when the task is code_review.
          type:
          - string
          - 'null'
        repo:
          type: string
          title: Repo
          default: local
        instructions:
          type: string
          title: Instructions
          default: Review this diff.
        goal:
          title: Goal
          description: Schema, connector, or integration question. Required when the
            task is schema_agent.
          type:
          - string
          - 'null'
        allow_side_effects:
          type: boolean
          title: Allow Side Effects
          default: false
        allow_writes:
          type: boolean
          title: Allow Writes
          default: false
      additionalProperties: false
      type: object
      title: RunInput
    RunStatusResponse:
      properties:
        run_id:
          type: string
          title: Run Id
        status:
          type: string
          enum:
          - queued
          - running
          - succeeded
          - failed
          title: Status
        task_type:
          type: string
          title: Task Type
        result:
          title: Result
          additionalProperties: true
          type:
          - object
          - 'null'
        episode_id:
          title: Episode Id
          type:
          - string
          - 'null'
        client_ref:
          title: Client Ref
          type:
          - string
          - 'null'
        error:
          title: Error
          type:
          - string
          - 'null'
      type: object
      required:
      - run_id
      - status
      - task_type
      title: RunStatusResponse
      description: 'Nullable fields are sent as JSON null and may also be omitted.


        result, episode_id, client_ref, and error use type [value, "null"] and are
        not required.'
    ScoreBreakdownModel:
      properties:
        knn:
          type: number
          title: Knn
        lexical:
          type: number
          title: Lexical
        field_match:
          type: number
          title: Field Match
        prior:
          type: number
          title: Prior
        rerank:
          type: number
          title: Rerank
        final:
          type: number
          title: Final
        warning:
          title: Warning
          type:
          - string
          - 'null'
        weights:
          additionalProperties: true
          type: object
          title: Weights
        terms:
          additionalProperties: true
          type: object
          title: Terms
        reranker:
          type: string
          title: Reranker
      type: object
      required:
      - knn
      - lexical
      - field_match
      - prior
      - rerank
      - final
      - weights
      - terms
      - reranker
      title: ScoreBreakdownModel
      description: warning is JSON null when the hit is not a failure or a planned
        connector.
    Error:
      type: object
      title: Error
      description: Every 4xx and 5xx body. details is omitted except on validation_error.
      additionalProperties: false
      required:
      - error
      properties:
        error:
          type: object
          additionalProperties: false
          required:
          - code
          - message
          - request_id
          properties:
            code:
              type: string
              title: Code
            message:
              type: string
              title: Message
            request_id:
              type: string
              title: Request Id
            details:
              type: array
              title: Details
              description: Field issues. Omitted when the failure is not a validation
                error.
              items:
                type: object
                additionalProperties: false
                required:
                - field
                - issue
                properties:
                  field:
                    type: string
                    title: Field
                  issue:
                    type: string
                    title: Issue
    RunStartedData:
      type: object
      title: RunStartedData
      description: Payload for event run.started.
      additionalProperties: false
      required:
      - run_id
      - task_type
      - at
      properties:
        run_id:
          type: string
          title: Run Id
        task_type:
          type: string
          title: Task Type
        at:
          type: string
          title: At
          description: UTC timestamp.
    NodeStartedData:
      type: object
      title: NodeStartedData
      description: Payload for event node.started.
      additionalProperties: false
      required:
      - node
      - at
      properties:
        node:
          type: string
          title: Node
        at:
          type: string
          title: At
          description: UTC timestamp.
    NodeCompletedData:
      type: object
      title: NodeCompletedData
      description: Payload for event node.completed.
      additionalProperties: false
      required:
      - node
      - status
      - at
      properties:
        node:
          type: string
          title: Node
        status:
          type: string
          enum:
          - completed
          title: Status
        at:
          type: string
          title: At
          description: UTC timestamp.
    RunCompletedData:
      type: object
      title: RunCompletedData
      description: Payload for event run.completed. episode_id is null only if the
        writer did not persist a row.
      additionalProperties: false
      properties:
        run_id:
          type: string
          title: Run Id
        status:
          type: string
          enum:
          - succeeded
          title: Status
        episode_id:
          type:
          - string
          - 'null'
          title: Episode Id
          description: Present as a string when the episode row exists. JSON null
            when it does not. The key is sent either way.
        at:
          type: string
          title: At
          description: UTC timestamp.
      required:
      - run_id
      - status
      - at
    RunFailedData:
      type: object
      title: RunFailedData
      description: Payload for event run.failed.
      additionalProperties: false
      properties:
        run_id:
          type: string
          title: Run Id
        status:
          type: string
          enum:
          - failed
          title: Status
        episode_id:
          type:
          - string
          - 'null'
          title: Episode Id
          description: String when an episode row was still written. JSON null when
            the run failed before the writer. The key is sent either way.
        error:
          type:
          - string
          - 'null'
          title: Error
          description: Failure message. JSON null when there is no message. The key
            is sent either way.
        at:
          type: string
          title: At
          description: UTC timestamp.
      required:
      - run_id
      - status
      - at
    RunEvent:
      type: object
      title: RunEvent
      description: One stored frame. The HTTP body is text/event-stream, not a JSON
        array of these objects.
      additionalProperties: false
      required:
      - id
      - event
      - data
      properties:
        id:
          type: integer
          minimum: 1
          title: Id
        event:
          type: string
          enum:
          - run.started
          - node.started
          - node.completed
          - run.completed
          - run.failed
          title: Event
        data:
          title: Data
          description: 'JSON object for the event name: RunStartedData, NodeStartedData,
            NodeCompletedData, RunCompletedData, or RunFailedData.'
          type: object
          additionalProperties: true
  securitySchemes:
    HTTPBearer:
      type: http
      description: Bearer API key scoped to a client such as ios-dev.
      scheme: bearer
