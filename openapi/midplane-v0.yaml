              required: true
              schema:
                type: integer
            RateLimit-Remaining:
              description: Requests left in the current window after this response.
              required: true
              schema:
                type: integer
            RateLimit-Reset:
              description: Seconds until the oldest request in the window expires.
              required: true
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
