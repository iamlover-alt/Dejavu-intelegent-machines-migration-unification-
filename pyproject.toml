[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "midplane"
version = "0.1.0"
description = "Dejavú Intelligent Machines mid-plane: first vertical slice"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "langgraph==1.2.24",
  "fastapi==0.165.0",
  "uvicorn==0.54.0",
  "PyYAML==6.0.4",
]

[project.optional-dependencies]
dev = [
  "pytest==9.2.0",
]
postgres = [
  "psycopg[binary]==3.3.9",
]

[tool.setuptools.packages.find]
include = ["midplane*"]

[tool.setuptools.package-data]
midplane = ["gateway/roster.json", "prompts/*.md", "connectors/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
