name: test

on:
  pull_request:
  push:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest

  swift-client:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate and compile the Swift client
        run: sh scripts/generate-swift-client.sh
